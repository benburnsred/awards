name: Tests

# Runs the unit tests for the voting script on every change. A red ✗ next to a commit means a test failed:
# don't paste that Code.gs into Apps Script until it's fixed.
on:
  push:
    paths: ['apps-script/**', 'vote/**', 'tests/**', 'tools/**', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
      - name: Video finder tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
